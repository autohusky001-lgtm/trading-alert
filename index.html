<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Dashboard v2</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --yellow: #d29922;
      --accent: #1f6feb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; min-height:100vh; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
    header h1 { font-size:18px; font-weight:600; color:var(--blue); }
    header h1 span { color:var(--text-muted); font-size:12px; font-weight:400; margin-left:8px; }
    .header-right { display:flex; align-items:center; gap:12px; }
    #last-update { font-size:12px; color:var(--text-muted); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .tabs { display:flex; gap:4px; padding:12px 24px 0; background:var(--surface); border-bottom:1px solid var(--border); }
    .tab-btn { padding:8px 18px; border:none; border-radius:6px 6px 0 0; background:transparent; color:var(--text-muted); cursor:pointer; font-size:13px; font-weight:500; transition:all 0.15s; border-bottom:2px solid transparent; }
    .tab-btn:hover { color:var(--text); background:var(--surface2); }
    .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); background:var(--surface2); }
    main { padding:20px 24px; display:flex; flex-direction:column; gap:20px; }
    .stats-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
    @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px; transition:border-color 0.15s; }
    .stat-card:hover { border-color:var(--accent); }
    .stat-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
    .stat-value { font-size:22px; font-weight:700; }
    .stat-value.green { color:var(--green); }
    .stat-value.red { color:var(--red); }
    .stat-value.blue { color:var(--blue); }
    .stat-value.yellow { color:var(--yellow); }
    .stat-value.purple { color:var(--purple); }
    .charts-row { display:grid; grid-template-columns:1fr 380px; gap:16px; }
    @media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
    .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .chart-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); }
    .chart-title { font-size:13px; font-weight:600; }
    .chart-subtitle { font-size:11px; color:var(--text-muted); margin-top:2px; }
    #equity-chart,#signal-chart-wrap { width:100%; height:280px; }
    .legend { display:flex; gap:16px; padding:8px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); }
    .legend-item { display:flex; align-items:center; gap:5px; }
    .legend-dot { width:8px; height:8px; border-radius:50%; }
    .live-signals-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .live-signals-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; padding:16px; }
    .pair-signals-block { background:var(--surface2); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .pair-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--border); }
    .pair-name { font-weight:600; font-size:13px; }
    .signal-row { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--border); }
    .signal-row:last-child { border-bottom:none; }
    .signal-time { font-size:11px; color:var(--text-muted); font-family:monospace; }
    .signal-badge { padding:2px 10px; border-radius:4px; font-size:11px; font-weight:700; letter-spacing:0.5px; }
    .signal-badge.call { background:rgba(63,185,80,0.15); color:var(--green); border:1px solid var(--green); }
    .signal-badge.put  { background:rgba(248,81,73,0.15);  color:var(--red);   border:1px solid var(--red); }
    .signal-score { font-size:12px; color:var(--text-muted); }
    .signal-price { font-size:11px; color:var(--text-muted); font-family:monospace; }
    .loading { display:flex; align-items:center; justify-content:center; height:200px; color:var(--text-muted); font-size:13px; }
    .error-msg { color:var(--red); padding:16px; font-size:12px; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>

<header>
  <h1>📈 Trading Dashboard <span>v2</span></h1>
  <div class="header-right">
    <div class="dot"></div>
    <span id="last-update">Loading…</span>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="stats-grid" id="stats-grid">
    <div class="loading" style="grid-column:1/-1">⏳ กำลังโหลดข้อมูล…</div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title">📊 Equity Curve</div>
          <div class="chart-subtitle" id="equity-subtitle">—</div>
        </div>
      </div>
      <div id="equity-chart"></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title">🎯 Signal Chart</div>
          <div class="chart-subtitle">Price + CALL/PUT arrows</div>
        </div>
      </div>
      <div id="signal-chart-wrap"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> CALL</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> PUT</div>
      </div>
    </div>
  </div>

  <div class="live-signals-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">⚡ Live Signals</div>
        <div class="chart-subtitle" id="live-subtitle">—</div>
      </div>
    </div>
    <div class="live-signals-grid" id="live-signals-grid">
      <div class="loading">⏳ โหลด live signals…</div>
    </div>
  </div>
</main>

<script>
const PAIRS = ['GBPUSD','USDJPY','NZDUSD','USDCHF','EURUSD'];
let backtest = {}, liveSignals = {}, activePair = PAIRS[0];
let equityChart = null, signalChart = null, signalSeries = null;

async function loadAll() {
  try {
    const [btRes, sigRes] = await Promise.all([
      fetch('./backtest.json'),
      fetch('./signals.json'),
    ]);
    if (!btRes.ok) throw new Error('backtest.json: ' + btRes.status);
    if (!sigRes.ok) throw new Error('signals.json: ' + sigRes.status);
    backtest = await btRes.json();
    const sigData = await sigRes.json();
    liveSignals = {};
    for (const s of (sigData.signals || [])) {
      if (!liveSignals[s.pair]) liveSignals[s.pair] = [];
      liveSignals[s.pair].push(s);
    }
    document.getElementById('last-update').textContent =
      'อัปเดต: ' + (sigData.last_update ? new Date(sigData.last_update).toLocaleString('th-TH') : '—');
    buildTabs();
    renderAll(activePair);
    renderLiveSignals();
  } catch (err) {
    document.getElementById('stats-grid').innerHTML =
      '<div class="error-msg">❌ โหลดข้อมูลล้มเหลว: ' + err.message + '</div>';
    console.error(err);
  }
}

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  for (const pair of PAIRS) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (pair === activePair ? ' active' : '');
    btn.textContent = pair;
    btn.onclick = () => {
      activePair = pair;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll(pair);
    };
    el.appendChild(btn);
  }
}

function renderStats(pair) {
  const data = backtest[pair];
  if (!data) return;
  const s = data.stats;
  const f = (v, d=2) => Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value green">${f(s.win_rate)}%</div></div>
    <div class="stat-card"><div class="stat-label">Total PnL</div><div class="stat-value ${s.pnl>=0?'green':'red'}">\$${f(s.pnl,0)}</div></div>
    <div class="stat-card"><div class="stat-label">Max Drawdown</div><div class="stat-value red">${f(s.max_drawdown)}%</div></div>
    <div class="stat-card"><div class="stat-label">Total Trades</div><div class="stat-value blue">${s.total_trades.toLocaleString()}</div></div>
    <div class="stat-card"><div class="stat-label">Accuracy</div><div class="stat-value yellow">${f(s.accuracy)}%</div></div>
    <div class="stat-card"><div class="stat-label">AUC</div><div class="stat-value purple">${f(s.auc,4)}</div></div>
  `;
}

function dedup(arr, keyFn) {
  const seen = new Set();
  return arr.filter(x => { const k = keyFn(x); if (seen.has(k)) return false; seen.add(k); return true; });
}

function renderEquityChart(pair) {
  const data = backtest[pair];
  if (!data) return;
  const s = data.stats;
  document.getElementById('equity-subtitle').textContent =
    pair + ' | Trades: ' + s.total_trades + ' | WR: ' + s.win_rate + '%';
  const container = document.getElementById('equity-chart');
  if (equityChart) { equityChart.remove(); equityChart = null; }
  equityChart = LightweightCharts.createChart(container, {
    width: container.clientWidth, height: 280,
    layout: { background:{color:'#161b22'}, textColor:'#7d8590' },
    grid: { vertLines:{color:'#21262d'}, horzLines:{color:'#21262d'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:'#30363d' },
    timeScale: { borderColor:'#30363d', timeVisible:true },
  });
  const series = equityChart.addAreaSeries({
    lineColor:'#58a6ff', topColor:'rgba(88,166,255,0.3)', bottomColor:'rgba(88,166,255,0.02)', lineWidth:2
  });
  const pts = dedup(data.equity || [], p => p.time).sort((a,b) => a.time - b.time);
  series.setData(pts);
  equityChart.timeScale().fitContent();
  new ResizeObserver(() => equityChart.applyOptions({width:container.clientWidth})).observe(container);
}

function renderSignalChart(pair) {
  const data = backtest[pair];
  if (!data) return;
  const signals = data.signals || [];
  const container = document.getElementById('signal-chart-wrap');
  if (signalChart) { signalChart.remove(); signalChart = null; }
  signalChart = LightweightCharts.createChart(container, {
    width: container.clientWidth, height: 280,
    layout: { background:{color:'#161b22'}, textColor:'#7d8590' },
    grid: { vertLines:{color:'#21262d'}, horzLines:{color:'#21262d'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:'#30363d' },
    timeScale: { borderColor:'#30363d', timeVisible:true },
  });
  signalSeries = signalChart.addLineSeries({
    color:'#8b949e', lineWidth:1, lastValueVisible:false, priceLineVisible:false
  });
  const priceData = dedup(signals.map(s=>({time:s.time,value:s.price})), p=>p.time).sort((a,b)=>a.time-b.time);
  signalSeries.setData(priceData);

  const subset = signals.slice(-120);
  const markers = dedup(subset.map(s => ({
    time: s.time,
    position: s.signal==='CALL' ? 'belowBar' : 'aboveBar',
    color: s.signal==='CALL' ? '#3fb950' : '#f85149',
    shape: s.signal==='CALL' ? 'arrowUp' : 'arrowDown',
    text: s.score.toFixed(1) + '%',
    size: 1,
  })), m => m.time).sort((a,b)=>a.time-b.time);
  signalSeries.setMarkers(markers);
  signalChart.timeScale().fitContent();
  new ResizeObserver(() => signalChart.applyOptions({width:container.clientWidth})).observe(container);
}

function renderLiveSignals() {
  const grid = document.getElementById('live-signals-grid');
  const sigPairs = Object.keys(liveSignals);
  if (sigPairs.length === 0) { grid.innerHTML = '<div class="loading">ไม่มี live signals</div>'; return; }
  document.getElementById('live-subtitle').textContent =
    sigPairs.length + ' คู่เงิน · ' + Object.values(liveSignals).flat().length + ' signals';
  grid.innerHTML = '';
  for (const pair of PAIRS) {
    if (!liveSignals[pair]) continue;
    const sigs = liveSignals[pair].slice(0, 6);
    const latest = sigs[0];
    const block = document.createElement('div');
    block.className = 'pair-signals-block';
    block.innerHTML = '<div class="pair-header"><span class="pair-name">💱 ' + pair + '</span>' +
      (latest ? '<span class="signal-badge ' + latest.signal.toLowerCase() + '">' + latest.signal + '</span>' : '') +
      '</div>' +
      sigs.map(s => {
        const dt = new Date(s.time);
        const ts = dt.toLocaleString('th-TH',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        const cls = s.signal.toLowerCase();
        return '<div class="signal-row">' +
          '<span class="signal-time">' + ts + '</span>' +
          '<span class="signal-badge ' + cls + '">' + s.signal + '</span>' +
          '<span class="signal-score">' + s.score.toFixed(1) + '%</span>' +
          '<span class="signal-price">' + s.price.toFixed(5) + '</span>' +
          '</div>';
      }).join('');
    grid.appendChild(block);
  }
}

function renderAll(pair) {
  renderStats(pair);
  renderEquityChart(pair);
  renderSignalChart(pair);
}

loadAll();
</script>
</body>
</html>
